# Generated by sarus-suite system installation.
# graphroot and runroot intentionally use Podman's per-user defaults. Sarusctl
# supplies each user's resolved Parallax store through --storage-opt instead of
# relying on a system-wide additionalimagestores value.

[storage]
driver = "overlay"

[storage.options.overlay]
mount_program = "@@SARUS_SUITE_BIN@@/parallax-mount-program"
ignore_chown_errors = "true"
